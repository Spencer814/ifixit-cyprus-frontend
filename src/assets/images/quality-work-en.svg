<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="qualityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.1)"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#qualityGrad)" rx="12"/>
  
  <!-- Professional worker silhouette -->
  <g transform="translate(50, 40)" filter="url(#shadow)">
    <!-- Hard hat -->
    <ellipse cx="50" cy="25" rx="25" ry="15" fill="#b69d3f"/>
    <rect x="25" y="25" width="50" height="8" fill="#9a8235" rx="4"/>
    
    <!-- Person working -->
    <circle cx="50" cy="45" r="12" fill="#64748b"/>
    <rect x="40" y="55" width="20" height="30" fill="#374151" rx="3"/>
    <rect x="35" y="75" width="10" height="20" fill="#374151" rx="2"/>
    <rect x="55" y="75" width="10" height="20" fill="#374151" rx="2"/>
    
    <!-- Tool in hand -->
    <rect x="65" y="60" width="15" height="3" fill="#b69d3f" rx="1"/>
    <circle cx="75" cy="55" r="4" fill="#9a8235"/>
  </g>
  
  <!-- Quality symbols -->
  <g transform="translate(150, 60)">
    <!-- Quality check marks -->
    <circle cx="20" cy="20" r="15" fill="#10b981" opacity="0.2"/>
    <path d="M12 20 L18 25 L28 15" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <circle cx="50" cy="35" r="12" fill="#10b981" opacity="0.2"/>
    <path d="M44 35 L48 38 L56 30" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <circle cx="35" cy="55" r="10" fill="#10b981" opacity="0.2"/>
    <path d="M30 55 L33 57 L40 50" stroke="#10b981" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Tools -->
  <g transform="translate(200, 120)" opacity="0.6">
    <!-- Wrench -->
    <rect x="0" y="10" width="25" height="4" fill="#64748b" rx="2"/>
    <circle cx="5" cy="12" r="6" fill="none" stroke="#64748b" stroke-width="2"/>
    
    <!-- Hammer -->
    <rect x="30" y="8" width="4" height="15" fill="#8b5f47" rx="2"/>
    <rect x="26" y="8" width="12" height="6" fill="#64748b" rx="1"/>
    
    <!-- Level -->
    <rect x="50" y="10" width="30" height="4" fill="#f59e0b" rx="2"/>
    <circle cx="65" cy="12" r="1.5" fill="#22c55e"/>
  </g>
  
  <!-- Text in English -->
  <text x="150" y="180" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#131836">Quality Work</text>
</svg>