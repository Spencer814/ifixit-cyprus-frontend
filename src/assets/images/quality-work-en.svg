<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="qualityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.1)"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#qualityGrad)" rx="12"/>
  
  <!-- Professional contractor figure -->
  <g transform="translate(80, 60)" filter="url(#shadow)">
    <!-- Head -->
    <circle cx="30" cy="20" r="15" fill="#fbbf24"/>
    <!-- Hard hat -->
    <path d="M15 15 Q30 10 45 15 L45 20 Q30 15 15 20 Z" fill="#b69d3f"/>
    
    <!-- Body -->
    <rect x="20" y="32" width="20" height="40" fill="#b69d3f" rx="3"/>
    
    <!-- Arms -->
    <rect x="12" y="38" width="10" height="20" fill="#b69d3f" rx="2"/>
    <rect x="38" y="38" width="10" height="20" fill="#b69d3f" rx="2"/>
    
    <!-- Legs -->
    <rect x="22" y="70" width="7" height="25" fill="#374151" rx="2"/>
    <rect x="31" y="70" width="7" height="25" fill="#374151" rx="2"/>
    
    <!-- Tools -->
    <rect x="48" y="45" width="15" height="3" fill="#374151" rx="1"/>
    <rect x="52" y="42" width="3" height="8" fill="#64748b"/>
    
    <!-- Tool belt -->
    <rect x="18" y="50" width="24" height="4" fill="#374151" rx="1"/>
    <rect x="20" y="52" width="4" height="6" fill="#64748b"/>
    <rect x="26" y="52" width="4" height="6" fill="#64748b"/>
    <rect x="32" y="52" width="4" height="6" fill="#64748b"/>
    <rect x="38" y="52" width="4" height="6" fill="#64748b"/>
  </g>
  
  <!-- Quality checkmark -->
  <g transform="translate(200, 50)">
    <circle cx="20" cy="20" r="18" fill="#10b981" opacity="0.9"/>
    <path d="M12 20 L18 26 L28 16" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Text -->
  <text x="150" y="180" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#131836">Quality Work</text>
</svg>