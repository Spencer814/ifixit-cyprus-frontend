<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="fastGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.1)"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#fastGrad)" rx="12"/>
  
  <!-- Service van -->
  <g transform="translate(40, 90)" filter="url(#shadow)">
    <!-- Van body -->
    <rect x="0" y="20" width="80" height="35" fill="#b69d3f" rx="3"/>
    <rect x="0" y="20" width="15" height="35" fill="#9a8235" rx="3"/>
    
    <!-- Windows -->
    <rect x="5" y="25" width="8" height="12" fill="#e0f2fe" rx="1"/>
    <rect x="20" y="25" width="15" height="12" fill="#e0f2fe" rx="1"/>
    <rect x="40" y="25" width="15" height="12" fill="#e0f2fe" rx="1"/>
    
    <!-- Wheels -->
    <circle cx="15" cy="60" r="8" fill="#374151"/>
    <circle cx="15" cy="60" r="5" fill="#64748b"/>
    <circle cx="65" cy="60" r="8" fill="#374151"/>
    <circle cx="65" cy="60" r="5" fill="#64748b"/>
    
    <!-- Tools on top -->
    <rect x="25" y="15" width="30" height="3" fill="#374151" rx="1"/>
    <rect x="30" y="12" width="2" height="6" fill="#64748b"/>
    <rect x="40" y="12" width="2" height="6" fill="#64748b"/>
    <rect x="50" y="12" width="2" height="6" fill="#64748b"/>
  </g>
  
  <!-- Speed lines -->
  <g opacity="0.7">
    <line x1="140" y1="80" x2="170" y2="80" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <line x1="145" y1="90" x2="180" y2="90" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <line x1="142" y1="100" x2="175" y2="100" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <line x1="148" y1="110" x2="185" y2="110" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Clock showing 24/7 -->
  <g transform="translate(200, 50)">
    <circle cx="30" cy="30" r="25" fill="white" stroke="#b69d3f" stroke-width="3"/>
    <circle cx="30" cy="30" r="2" fill="#b69d3f"/>
    
    <!-- Clock hands -->
    <line x1="30" y1="30" x2="30" y2="15" stroke="#b69d3f" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="30" x2="40" y2="30" stroke="#b69d3f" stroke-width="2" stroke-linecap="round"/>
    
    <!-- 24/7 text -->
    <text x="30" y="85" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#b69d3f">24/7</text>
  </g>
  
  <!-- Lightning bolt for speed -->
  <g transform="translate(160, 40)">
    <path d="M15 5 L5 20 L12 20 L8 35 L18 20 L11 20 Z" fill="#f59e0b" opacity="0.8"/>
  </g>
  
  <!-- Text in Hebrew -->
  <text x="150" y="180" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#131836">שירות מהיר</text>
</svg>