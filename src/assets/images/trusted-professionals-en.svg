<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="trustedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.1)"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#trustedGrad)" rx="12"/>
  
  <!-- Three professionals -->
  <g filter="url(#shadow)">
    <!-- Professional 1 -->
    <g transform="translate(30, 60)">
      <!-- Head -->
      <circle cx="20" cy="15" r="12" fill="#fbbf24"/>
      <!-- Body -->
      <rect x="10" y="25" width="20" height="35" fill="#b69d3f" rx="3"/>
      <!-- Arms -->
      <rect x="5" y="30" width="8" height="15" fill="#b69d3f" rx="2"/>
      <rect x="27" y="30" width="8" height="15" fill="#b69d3f" rx="2"/>
      <!-- Tool in hand -->
      <rect x="32" y="35" width="8" height="3" fill="#374151" rx="1"/>
    </g>
    
    <!-- Professional 2 -->
    <g transform="translate(110, 60)">
      <!-- Head -->
      <circle cx="20" cy="15" r="12" fill="#fbbf24"/>
      <!-- Body -->
      <rect x="10" y="25" width="20" height="35" fill="#b69d3f" rx="3"/>
      <!-- Arms -->
      <rect x="5" y="30" width="8" height="15" fill="#b69d3f" rx="2"/>
      <rect x="27" y="30" width="8" height="15" fill="#b69d3f" rx="2"/>
      <!-- Tool in hand -->
      <rect x="32" y="35" width="8" height="3" fill="#374151" rx="1"/>
    </g>
    
    <!-- Professional 3 -->
    <g transform="translate(190, 60)">
      <!-- Head -->
      <circle cx="20" cy="15" r="12" fill="#fbbf24"/>
      <!-- Body -->
      <rect x="10" y="25" width="20" height="35" fill="#b69d3f" rx="3"/>
      <!-- Arms -->
      <rect x="5" y="30" width="8" height="15" fill="#b69d3f" rx="2"/>
      <rect x="27" y="30" width="8" height="15" fill="#b69d3f" rx="2"/>
      <!-- Tool in hand -->
      <rect x="32" y="35" width="8" height="3" fill="#374151" rx="1"/>
    </g>
  </g>
  
  <!-- Certification badges -->
  <g transform="translate(50, 30)">
    <circle cx="0" cy="0" r="15" fill="#f59e0b" opacity="0.9"/>
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="white">✓</text>
  </g>
  
  <g transform="translate(150, 25)">
    <circle cx="0" cy="0" r="15" fill="#f59e0b" opacity="0.9"/>
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="white">✓</text>
  </g>
  
  <g transform="translate(250, 30)">
    <circle cx="0" cy="0" r="15" fill="#f59e0b" opacity="0.9"/>
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="white">✓</text>
  </g>
  
  <!-- Text -->
  <text x="150" y="180" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#131836">Trusted Professionals</text>
</svg>