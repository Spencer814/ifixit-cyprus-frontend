<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Background circle -->
  <circle cx="8" cy="8" r="8" fill="#131836"/>
  
  <!-- Gold wrench icon -->
  <g fill="#b69d3f">
    <!-- Wrench handle -->
    <rect x="4" y="11" width="1.5" height="4" rx="0.75" transform="rotate(-45 4 11)"/>
    
    <!-- Wrench head -->
    <circle cx="6" cy="6" r="3" fill="none" stroke="#b69d3f" stroke-width="1"/>
    <circle cx="6" cy="6" r="1.5" fill="none" stroke="#b69d3f" stroke-width="0.5"/>
    
    <!-- Adjustment points -->
    <circle cx="9" cy="6" r="0.5" fill="#b69d3f"/>
    <circle cx="6" cy="3" r="0.5" fill="#b69d3f"/>
  </g>
  
  <!-- Highlight -->
  <circle cx="10" cy="4" r="1" fill="#d4c760" opacity="0.6"/>
</svg>