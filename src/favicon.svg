<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <!-- Gradients for realistic look -->
    <radialGradient id="bgGrad" cx="0.3" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#1e2347"/>
      <stop offset="70%" stop-color="#131836"/>
      <stop offset="100%" stop-color="#0f1429"/>
    </radialGradient>
    
    <linearGradient id="wrenchGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6d575"/>
      <stop offset="30%" stop-color="#d4c760"/>
      <stop offset="70%" stop-color="#b69d3f"/>
      <stop offset="100%" stop-color="#9a8235"/>
    </linearGradient>
    
    <linearGradient id="wrenchDark" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7a6b2a"/>
      <stop offset="50%" stop-color="#9a8235"/>
      <stop offset="100%" stop-color="#b69d3f"/>
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
    
    <!-- Inner shadow for depth -->
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feOffset dx="0" dy="0"/>
      <feGaussianBlur stdDeviation="1" result="offset-blur"/>
      <feFlood flood-color="rgba(0,0,0,0.3)"/>
      <feComposite in2="offset-blur" operator="in"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#bgGrad)"/>
  
  <!-- Wrench assembly -->
  <g filter="url(#dropShadow)">
    
    <!-- Main wrench handle -->
    <rect x="20" y="42" width="6" height="20" rx="3" 
          fill="url(#wrenchGold)" 
          transform="rotate(-45 23 52)"/>
    
    <!-- Handle grip lines -->
    <g transform="rotate(-45 23 52)" opacity="0.6">
      <line x1="21" y1="45" x2="25" y2="45" stroke="url(#wrenchDark)" stroke-width="0.5"/>
      <line x1="21" y1="48" x2="25" y2="48" stroke="url(#wrenchDark)" stroke-width="0.5"/>
      <line x1="21" y1="51" x2="25" y2="51" stroke="url(#wrenchDark)" stroke-width="0.5"/>
      <line x1="21" y1="54" x2="25" y2="54" stroke="url(#wrenchDark)" stroke-width="0.5"/>
    </g>
    
    <!-- Main wrench head (outer ring) -->
    <circle cx="24" cy="24" r="12" 
            fill="none" 
            stroke="url(#wrenchGold)" 
            stroke-width="3.5"/>
    
    <!-- Inner adjustment ring -->
    <circle cx="24" cy="24" r="8" 
            fill="none" 
            stroke="url(#wrenchGold)" 
            stroke-width="2" 
            opacity="0.9"/>
    
    <!-- Wrench jaw extensions -->
    <!-- Top jaw -->
    <rect x="22" y="8" width="4" height="8" rx="2" fill="url(#wrenchGold)"/>
    <rect x="23" y="9" width="2" height="6" rx="1" fill="url(#wrenchDark)" opacity="0.3"/>
    
    <!-- Right jaw -->
    <rect x="34" y="22" width="8" height="4" rx="2" fill="url(#wrenchGold)"/>
    <rect x="35" y="23" width="6" height="2" rx="1" fill="url(#wrenchDark)" opacity="0.3"/>
    
    <!-- Adjustment bolts/nuts -->
    <circle cx="36" cy="24" r="2.5" fill="#e6d575"/>
    <circle cx="36" cy="24" r="1.8" fill="url(#wrenchDark)" opacity="0.3"/>
    <circle cx="24" cy="12" r="2.5" fill="#e6d575"/>
    <circle cx="24" cy="12" r="1.8" fill="url(#wrenchDark)" opacity="0.3"/>
    
    <!-- Additional detail bolts -->
    <circle cx="16" cy="16" r="1.5" fill="#d4c760" opacity="0.8"/>
    <circle cx="32" cy="32" r="1.2" fill="#d4c760" opacity="0.6"/>
    
    <!-- Center hex bolt detail -->
    <polygon points="24,21 26.5,22.5 26.5,25.5 24,27 21.5,25.5 21.5,22.5" 
             fill="url(#wrenchDark)" opacity="0.4"/>
  </g>
  
  <!-- Highlight for 3D effect -->
  <ellipse cx="42" cy="16" rx="4" ry="3" fill="#f0e68c" opacity="0.3"/>
  
  <!-- Surface scratches for realism -->
  <g opacity="0.2">
    <line x1="18" y1="28" x2="30" y2="16" stroke="#e6d575" stroke-width="0.3"/>
    <line x1="30" y1="28" x2="18" y2="16" stroke="#e6d575" stroke-width="0.3"/>
    <line x1="26" y1="20" x2="28" y2="18" stroke="#e6d575" stroke-width="0.3"/>
  </g>
</svg>