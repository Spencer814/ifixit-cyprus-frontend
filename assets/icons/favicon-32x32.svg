<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#131836"/>
  
  <!-- Gold wrench icon -->
  <g fill="#b69d3f">
    <!-- Wrench handle -->
    <rect x="8" y="22" width="3" height="8" rx="1.5" transform="rotate(-45 8 22)"/>
    
    <!-- Wrench head -->
    <circle cx="12" cy="12" r="6" fill="none" stroke="#b69d3f" stroke-width="2"/>
    <circle cx="12" cy="12" r="3" fill="none" stroke="#b69d3f" stroke-width="1"/>
    
    <!-- Adjustment points -->
    <circle cx="18" cy="12" r="1" fill="#b69d3f"/>
    <circle cx="12" cy="6" r="1" fill="#b69d3f"/>
  </g>
  
  <!-- Highlight -->
  <circle cx="20" cy="8" r="2" fill="#d4c760" opacity="0.6"/>
</svg>