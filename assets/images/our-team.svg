<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="teamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131836"/>
      <stop offset="100%" stop-color="#1a1f4a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#teamGrad)" rx="16"/>
  
  <!-- Team of professionals -->
  <g transform="translate(60, 80)" filter="url(#shadow)">
    
    <!-- Team Member 1 - Electrician -->
    <g>
      <circle cx="30" cy="30" r="15" fill="#d4c760"/>
      <rect x="18" y="43" width="24" height="35" fill="#374151" rx="3"/>
      <!-- Tool in hand -->
      <rect x="50" y="50" width="12" height="3" fill="#f59e0b" rx="1"/>
      <!-- Safety helmet -->
      <ellipse cx="30" cy="22" rx="18" ry="12" fill="#f59e0b"/>
      <rect x="12" y="22" width="36" height="5" fill="#d97706" rx="2"/>
      <!-- Name badge -->
      <rect x="35" y="45" width="8" height="6" fill="white" rx="1"/>
    </g>
    
    <!-- Team Member 2 - Plumber -->
    <g transform="translate(70, 0)">
      <circle cx="30" cy="30" r="15" fill="#b69d3f"/>
      <rect x="18" y="43" width="24" height="35" fill="#1f2937" rx="3"/>
      <!-- Wrench -->
      <rect x="48" y="52" width="10" height="2" fill="#64748b" rx="1"/>
      <circle cx="51" cy="53" r="4" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <!-- Cap -->
      <ellipse cx="30" cy="22" rx="16" ry="10" fill="#3b82f6"/>
      <!-- Name badge -->
      <rect x="35" y="45" width="8" height="6" fill="white" rx="1"/>
    </g>
    
    <!-- Team Member 3 - Painter -->
    <g transform="translate(140, 0)">
      <circle cx="30" cy="30" r="15" fill="#9a8235"/>
      <rect x="18" y="43" width="24" height="35" fill="#374151" rx="3"/>
      <!-- Paint brush -->
      <rect x="47" y="48" width="2" height="15" fill="#8b5f47" rx="1"/>
      <ellipse cx="48" cy="47" rx="3" ry="2" fill="#ec4899"/>
      <!-- Bandana -->
      <path d="M15 25 Q30 18, 45 25 Q40 28, 30 28 Q20 28, 15 25" fill="#dc2626"/>
      <!-- Name badge -->
      <rect x="35" y="45" width="8" height="6" fill="white" rx="1"/>
    </g>
    
    <!-- Team Member 4 - General Contractor -->
    <g transform="translate(210, 0)">
      <circle cx="30" cy="30" r="15" fill="#64748b"/>
      <rect x="18" y="43" width="24" height="35" fill="#1f2937" rx="3"/>
      <!-- Clipboard -->
      <rect x="46" y="48" width="8" height="12" fill="white" stroke="#374151" rx="1"/>
      <line x1="48" y1="52" x2="52" y2="52" stroke="#374151" stroke-width="0.5"/>
      <line x1="48" y1="54" x2="52" y2="54" stroke="#374151" stroke-width="0.5"/>
      <line x1="48" y1="56" x2="52" y2="56" stroke="#374151" stroke-width="0.5"/>
      <!-- Hard hat -->
      <ellipse cx="30" cy="22" rx="18" ry="12" fill="white"/>
      <rect x="12" y="22" width="36" height="5" fill="#e5e7eb" rx="2"/>
      <!-- Name badge -->
      <rect x="35" y="45" width="8" height="6" fill="white" rx="1"/>
    </g>
  </g>
  
  <!-- Company van in background -->
  <g transform="translate(50, 200)" opacity="0.4">
    <rect x="0" y="0" width="100" height="40" fill="#b69d3f" rx="5"/>
    <rect x="5" y="5" width="12" height="15" fill="#e0f2fe" rx="2"/>
    <rect x="20" y="5" width="25" height="15" fill="#e0f2fe" rx="2"/>
    <circle cx="20" cy="45" r="8" fill="#374151"/>
    <circle cx="80" cy="45" r="8" fill="#374151"/>
    <text x="50" y="28" font-family="system-ui, sans-serif" font-size="8" font-weight="600" text-anchor="middle" fill="white">IFixIt</text>
  </g>
  
  <!-- Tools scattered around -->
  <g opacity="0.3">
    <g transform="translate(320, 120)">
      <rect x="0" y="0" width="20" height="3" fill="#d4c760" rx="1"/>
      <circle cx="5" cy="1.5" r="5" fill="none" stroke="#d4c760" stroke-width="1"/>
    </g>
    <g transform="translate(340, 200)">
      <rect x="0" y="0" width="3" height="15" fill="#8b5f47" rx="1"/>
      <rect x="-2" y="0" width="7" height="5" fill="#64748b" rx="1"/>
    </g>
  </g>
  
  <!-- Text -->
  <text x="200" y="270" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#d4c760">Our Professional Team</text>
</svg>