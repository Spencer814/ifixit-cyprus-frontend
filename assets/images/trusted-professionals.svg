<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="trustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.1)"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" fill="url(#trustGrad)" rx="12"/>
  
  <!-- Shield (trust symbol) -->
  <g transform="translate(130, 30)" filter="url(#shadow)">
    <path d="M20 10 Q20 5, 15 5 Q10 5, 5 5 Q0 5, 0 10 L0 35 Q0 45, 10 50 Q15 52, 20 50 Q30 45, 30 35 L30 10 Q30 5, 25 5 Q20 5, 15 5 Q10 5, 5 5 Q0 5, 0 10" fill="#10b981"/>
    
    <!-- Checkmark in shield -->
    <path d="M8 25 L12 30 L22 18" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Professional figures -->
  <g transform="translate(50, 80)">
    <!-- Person 1 -->
    <g>
      <circle cx="20" cy="20" r="10" fill="#b69d3f"/>
      <rect x="12" y="28" width="16" height="25" fill="#131836" rx="2"/>
      <!-- Hard hat -->
      <ellipse cx="20" cy="15" rx="12" ry="8" fill="#f59e0b"/>
      <!-- ID badge -->
      <rect x="22" y="30" width="6" height="8" fill="white" rx="1"/>
      <line x1="23" y1="32" x2="27" y2="32" stroke="#b69d3f" stroke-width="0.5"/>
      <line x1="23" y1="34" x2="27" y2="34" stroke="#b69d3f" stroke-width="0.5"/>
    </g>
    
    <!-- Person 2 -->
    <g transform="translate(50, 0)">
      <circle cx="20" cy="20" r="10" fill="#9a8235"/>
      <rect x="12" y="28" width="16" height="25" fill="#374151" rx="2"/>
      <!-- Tool belt -->
      <rect x="10" y="40" width="20" height="4" fill="#8b5f47" rx="1"/>
      <!-- ID badge -->
      <rect x="22" y="30" width="6" height="8" fill="white" rx="1"/>
      <line x1="23" y1="32" x2="27" y2="32" stroke="#b69d3f" stroke-width="0.5"/>
      <line x1="23" y1="34" x2="27" y2="34" stroke="#b69d3f" stroke-width="0.5"/>
    </g>
    
    <!-- Person 3 -->
    <g transform="translate(100, 0)">
      <circle cx="20" cy="20" r="10" fill="#64748b"/>
      <rect x="12" y="28" width="16" height="25" fill="#131836" rx="2"/>
      <!-- Safety vest -->
      <rect x="10" y="30" width="20" height="15" fill="#f59e0b" opacity="0.8" rx="2"/>
      <!-- Reflective stripes -->
      <line x1="12" y1="35" x2="28" y2="35" stroke="white" stroke-width="1"/>
      <line x1="12" y1="40" x2="28" y2="40" stroke="white" stroke-width="1"/>
      <!-- ID badge -->
      <rect x="22" y="32" width="6" height="8" fill="white" rx="1"/>
      <line x1="23" y1="34" x2="27" y2="34" stroke="#b69d3f" stroke-width="0.5"/>
      <line x1="23" y1="36" x2="27" y2="36" stroke="#b69d3f" stroke-width="0.5"/>
    </g>
  </g>
  
  <!-- Certification badges -->
  <g transform="translate(200, 100)">
    <!-- License badge -->
    <rect x="0" y="0" width="25" height="20" fill="#10b981" rx="3"/>
    <text x="12.5" y="8" font-family="system-ui, sans-serif" font-size="6" font-weight="600" text-anchor="middle" fill="white">LIC</text>
    <text x="12.5" y="16" font-family="system-ui, sans-serif" font-size="6" font-weight="600" text-anchor="middle" fill="white">✓</text>
    
    <!-- Certified badge -->
    <rect x="30" y="0" width="25" height="20" fill="#b69d3f" rx="3"/>
    <circle cx="42.5" cy="10" r="6" fill="none" stroke="white" stroke-width="1"/>
    <path d="M39 10 L41 12 L46 7" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Handshake (trust symbol) -->
  <g transform="translate(220, 60)" opacity="0.6">
    <path d="M5 15 Q8 12, 12 15 Q15 18, 18 15 Q22 12, 25 15" stroke="#b69d3f" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="8" cy="15" r="3" fill="#b69d3f"/>
    <circle cx="22" cy="15" r="3" fill="#9a8235"/>
  </g>
  
  <!-- Text -->
  <text x="150" y="180" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#131836">Trusted Professionals</text>
</svg>